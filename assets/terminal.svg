<text x="360" y="21" fill="#62778a" font-size="11" text-anchor="middle">vwdshka - zsh</text>
<text x="26.0" y="67.0" fill="#62778a" font-weight="400" textLength="93.6" lengthAdjust="spacing" class="o0">~/vwdshka $ </text>
<text x="119.6" y="67.0" fill="#7fd1d8" font-weight="500" textLength="46.8" lengthAdjust="spacing" class="t0">whoami</text>
<text x="26.0" y="89.0" fill="#f2f6fa" font-weight="400" textLength="569.4" lengthAdjust="spacing" class="t1">David Gavriilidis - BSc Software Development, Univ. of Greater Manchester</text>
<text x="26.0" y="133.0" fill="#62778a" font-weight="400" textLength="93.6" lengthAdjust="spacing" class="o3">~/vwdshka $ </text>
<text x="119.6" y="133.0" fill="#7fd1d8" font-weight="500" textLength="93.6" lengthAdjust="spacing" class="t3">cat focus.md</text>
<text x="26.0" y="155.0" fill="#f2f6fa" font-weight="400" textLength="405.6" lengthAdjust="spacing" class="t4">Backend and data extraction. Python, C#, TypeScript.</text>
<text x="26.0" y="177.0" fill="#62778a" font-weight="400" textLength="436.8" lengthAdjust="spacing" class="t5">Mostly the parts where the input doesn't match the spec.</text>
<text x="26.0" y="221.0" fill="#62778a" font-weight="400" textLength="93.6" lengthAdjust="spacing" class="o7">~/vwdshka $ </text>
<text x="119.6" y="221.0" fill="#7fd1d8" font-weight="500" textLength="117.0" lengthAdjust="spacing" class="t7">ls -1 projects/</text>
<text x="26.0" y="243.0" fill="#d7e0e8" font-weight="400" textLength="78.0" lengthAdjust="spacing" class="t8">ixnos-data</text>
<text x="228.8" y="243.0" fill="#62778a" font-weight="400" textLength="319.8" lengthAdjust="spacing" class="t8">search over Greek public procurement data</text>
<text x="26.0" y="265.0" fill="#d7e0e8" font-weight="400" textLength="132.6" lengthAdjust="spacing" class="t9">myData-Client-Lib</text>
<text x="228.8" y="265.0" fill="#62778a" font-weight="400" textLength="257.4" lengthAdjust="spacing" class="t9">typed .NET client for AADE myDATA</text>
<text x="26.0" y="287.0" fill="#d7e0e8" font-weight="400" textLength="54.6" lengthAdjust="spacing" class="t10">tabsesh</text>
<text x="228.8" y="287.0" fill="#62778a" font-weight="400" textLength="280.8" lengthAdjust="spacing" class="t10">tab manager with a built-in terminal</text>
<text x="26.0" y="331.0" fill="#62778a" font-weight="400" textLength="93.6" lengthAdjust="spacing" class="o12">~/vwdshka $ </text>
<text x="119.6" y="331.0" fill="#7fd1d8" font-weight="500" textLength="46.8" lengthAdjust="spacing" class="t12">status</text>
<text x="26.0" y="353.0" fill="#e8b563" font-weight="500" textLength="460.2" lengthAdjust="spacing" class="t13">● Open to junior backend / data roles - Athens or EU remote</text>
