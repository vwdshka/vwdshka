<text x="119.6" y="133.0" fill="#7fd1d8" font-weight="500" textLength="93.6" lengthAdjust="spacing" class="t3">cat focus.md</text>
<text x="26.0" y="155.0" fill="#f2f6fa" font-weight="400" textLength="405.6" lengthAdjust="spacing" class="t4">Backend and data extraction. Python, C#, JavaScript.</text>
<text x="26.0" y="177.0" fill="#62778a" font-weight="400" textLength="538.2" lengthAdjust="spacing" class="t5">Drawn to problems where the input is hostile and the schema is a lie.</text>
<text x="26.0" y="221.0" fill="#62778a" font-weight="400" textLength="93.6" lengthAdjust="spacing" class="o7">~/vwdshka $ </text>
<text x="119.6" y="221.0" fill="#7fd1d8" font-weight="500" textLength="117.0" lengthAdjust="spacing" class="t7">ls -1 projects/</text>
<text x="26.0" y="243.0" fill="#d7e0e8" font-weight="400" textLength="140.4" lengthAdjust="spacing" class="t8">openchartexcavator</text>
<text x="228.8" y="243.0" fill="#62778a" font-weight="400" textLength="327.6" lengthAdjust="spacing" class="t8">headless extraction from JS-rendered pages</text>
<text x="26.0" y="265.0" fill="#d7e0e8" font-weight="400" textLength="171.6" lengthAdjust="spacing" class="t9">llm-fake-news-detector</text>
<text x="228.8" y="265.0" fill="#62778a" font-weight="400" textLength="304.2" lengthAdjust="spacing" class="t9">classification over noisy, scraped text</text>
<text x="26.0" y="287.0" fill="#d7e0e8" font-weight="400" textLength="93.6" lengthAdjust="spacing" class="t10">cozychatnoui</text>
<text x="228.8" y="287.0" fill="#62778a" font-weight="400" textLength="304.2" lengthAdjust="spacing" class="t10">a chat server with no UI to hide behind</text>
<text x="26.0" y="331.0" fill="#62778a" font-weight="400" textLength="93.6" lengthAdjust="spacing" class="o12">~/vwdshka $ </text>
