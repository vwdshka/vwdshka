name: refresh header

on:
  schedule:
    - cron: "17 5 * * *"      # nightly, off the hour so it isn't queued with everyone else
  workflow_dispatch:
  push:
    paths:
      - "tools/render_terminal.py"
      - ".github/workflows/refresh-header.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render assets/boot.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: python3 tools/render_terminal.py

      - name: Commit if it changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/boot.svg
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "chore: refresh header"
          git push
