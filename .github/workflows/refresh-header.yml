name: render header

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/render_terminal.py"
      - ".github/workflows/refresh-header.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render assets/terminal.svg
        run: python3 tools/render_terminal.py

      - name: Commit if it changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/terminal.svg
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "chore: render header"
          git push
